<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>모두의 타워디펜스</title>
  <style>
    html,body{margin:0;height:100%;background:#0d1018;overflow:hidden}
    #game{width:100vw;height:100vh}
    /* 세로로 들었을 때 가로 전환 안내(웹 전용) */
    #rotate{position:fixed;inset:0;z-index:9999;display:none;
      flex-direction:column;align-items:center;justify-content:center;
      background:#0d1018;color:#cfe0ff;font-family:sans-serif;text-align:center;padding:24px}
    #rotate .ico{font-size:72px;animation:spin 1.6s ease-in-out infinite}
    #rotate .t{font-size:24px;font-weight:700;margin-top:18px}
    #rotate .s{font-size:15px;color:#8892b0;margin-top:10px;line-height:1.6}
    @keyframes spin{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
    /* 터치 기기(폰·태블릿)에서만 — PC 브라우저 좁은 창은 게임을 그대로 표시 */
    @media (orientation: portrait) and (pointer: coarse){#rotate{display:flex}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="ico">📱↻</div>
    <div class="t">가로로 돌려주세요</div>
    <div class="s">모두의 타워디펜스는 가로 화면 게임이에요.<br/>폰을 옆으로 돌리면 꽉 찬 화면으로 즐길 수 있어요.<br/>(설치한 앱은 자동으로 가로가 돼요)</div>
  </div>
  <script>
    // 웹에서 첫 터치 시 전체화면 + 가로 잠금 시도(안드 크롬 지원, iOS 사파리는 미지원 → 안내로 대체)
    (function () {
      var tried = false;
      function goLandscape() {
        if (tried) return; tried = true;
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        try {
          var p = fs ? fs.call(el) : Promise.resolve();
          Promise.resolve(p).then(function () {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function () {});
            }
          }).catch(function () {});
        } catch (e) { /* 미지원 환경은 조용히 무시 */ }
      }
      window.addEventListener('pointerdown', goLandscape, { once: true });
      window.addEventListener('touchstart', goLandscape, { once: true });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
